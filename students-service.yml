server:
  port: 8081

spring:
  application:
    name: students-service

  datasource:
    url: jdbc:mysql://localhost:3306/students_db
    username: root
    password: jasmine123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  file:
    name: logs/students-service.log

  level:
    root: INFO
    com.jasminesystem.studentsservice: DEBUG

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
