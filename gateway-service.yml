server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: students-service
          uri: lb://STUDENTS-SERVICE
          predicates:
            - Path=/students/**
          filters:
            - StripPrefix=1

        - id: courses-service
          uri: lb://COURSES-SERVICE
          predicates:
            - Path=/courses/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
