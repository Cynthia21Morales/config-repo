server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://192.168.0.102"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: students-service
          uri: lb://STUDENTS-SERVICE
          predicates:
            - Path=/students/**

        - id: courses-service
          uri: lb://COURSES-SERVICE
          predicates:
            - Path=/courses/**,/student-schedule/**
